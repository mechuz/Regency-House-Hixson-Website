<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 118" role="img"
     aria-label="Regency House — Senior Living Community">
  <title>Regency House — Senior Living Community</title>
  <!-- INTERIM RECONSTRUCTION of the Regency mark, drawn to match the brand
       colours (teal #5aaabe, rose #f096aa) and the REGENCY [CITY] lockup.
       Replace with the official Hixson artwork when it is available. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- heart outline, rose -->
    <path d="M58 100 C 18 71 9 48 21 33 C 32 19 51 23 58 38 C 65 23 84 19 95 33 C 107 48 98 71 58 100 Z"
          stroke="#f096aa" stroke-width="7"/>
    <!-- house, teal -->
    <path d="M20 68 L55 40 L90 68" stroke="#5aaabe" stroke-width="7"/>
    <path d="M29 63 L29 95 L81 95 L81 63" stroke="#5aaabe" stroke-width="7"/>
    <rect x="46" y="70" width="19" height="19" stroke="#5aaabe" stroke-width="5"/>
    <path d="M55.5 70 L55.5 89 M46 79.5 L65 79.5" stroke="#5aaabe" stroke-width="3.5"/>
  </g>
  <text x="140" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="40"
        fill="#5aaabe" letter-spacing="3.5">REGENCY HOUSE</text>
  <text x="144" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="19"
        fill="#f096aa" letter-spacing="4.4">SENIOR LIVING COMMUNITY</text>
</svg>
